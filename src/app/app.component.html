<section style="display:flex; flex-direction: column; align-items: center; max-width: 1200px; margin: 0 auto;width:100%;">
  <app-a11y-line-chart
	[data]="performanceData"
	[title]="'Actual vs Target Performance'"
  [theme]='{ targetPatternType:"diagonal" }'
	[a11y]="a11yConfig"
	[subtitle]="'Prototype accessible chart component'"
></app-a11y-line-chart>

<app-a11y-line-chart
	[data]="assessmentData"
	[title]="'Assessment Data (Historical + Targets)'"
	[a11y]="a11yConfig"
	[subtitle]="'Second instance POC'"
></app-a11y-line-chart>
</section>
