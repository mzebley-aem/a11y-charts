name: Chart verification
on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [target-line-chart, bar-chart, segmented-bar-chart]
    defaults:
      run:
        working-directory: packages/${{ matrix.chart }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/${{ matrix.chart }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - if: matrix.chart != 'segmented-bar-chart'
        run: npm run demo:build
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/target-line-chart/package-lock.json
            packages/bar-chart/package-lock.json
            packages/segmented-bar-chart/package-lock.json
            docs/package-lock.json
      - run: npm ci --prefix packages/target-line-chart
      - run: npm ci --prefix packages/bar-chart
      - run: npm ci --prefix packages/segmented-bar-chart
      - run: npm ci --prefix docs
      # Builds each package's dist, then the docs site, which renders the live
      # examples from those builds. Browser checks of the site run in the
      # browser job.
      - run: npm run docs:build
      # Checks the example modules against the package types built above.
      - run: npm run docs:typecheck
  browser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix packages/target-line-chart
      - run: npm ci --prefix packages/bar-chart
      - run: npm ci --prefix packages/segmented-bar-chart
      - run: npm ci --prefix docs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/target-line-chart
      - run: npm run demo:build --prefix packages/target-line-chart
      - run: npm run demo:build --prefix packages/bar-chart
      - run: npm run browser:test
      # The examples and report prototypes live in the docs site; the suites
      # below run against this build.
      - run: npm run docs:build
      - run: npm run browser:docs
      - if: matrix.browser == 'chromium'
        run: npm run browser:grouped && npm run browser:themes
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
      - if: matrix.browser == 'chromium'
        run: npm run browser:segmented && npm run browser:dispute-resolution && npm run browser:spp-apr
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
      - if: matrix.browser == 'chromium'
        run: npm run artifacts:test
